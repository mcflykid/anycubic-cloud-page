<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Connexion — Anycubic Cloud Page</title>
<link rel="icon" href="/imprimante-api/ui/icons/cloud-page.svg" type="image/svg+xml">
<link rel="stylesheet" href="/imprimante-api/ui/css/landing.css">
<link rel="stylesheet" href="/imprimante-api/ui/css/imprimante.css">
<link rel="stylesheet" href="/imprimante-api/ui/css/lab.css"><link rel="stylesheet" href="/imprimante-api/ui/css/workshop-styles.css"></head>
<body class="login-body">
<div class="login-orbits" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="login-card">
<img src="/imprimante-api/ui/icons/cloud-page.svg" width="52" height="52" alt="">
<p class="login-brand">Anycubic Cloud Page</p>
<h1>Retrouver mon atelier</h1>
<p class="muted">Connectez-vous avec les identifiants de cette page, distincts de votre compte Anycubic.</p>
<!-- LOGIN_MESSAGE -->
<form action="/login" method="post">
<label for="username">Identifiant</label>
<input id="username" name="username" autocomplete="username" maxlength="256" required autofocus>
<label for="password">Mot de passe</label>
<div class="login-password"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="2048" required><button id="password-visibility" type="button" disabled aria-controls="password" aria-pressed="false">Afficher</button></div>
<button type="submit" class="primary login-submit"><span>Se connecter</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
<p id="login-status" role="status" aria-live="polite"></p>
</form>
<p class="login-note">Votre session reste ouverte pendant huit heures au maximum.</p>
</main>
<script id="workshop-language" type="module" src="/imprimante-api/ui/js/workshop-ui.mjs"></script><script id="login-interactions" type="module" src="/imprimante-api/ui/js/workshop-login.mjs"></script></body>
</html>
