<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lote · Moxen</title>
<!-- una hoja por familia -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400&display=swap">
<link rel="stylesheet" href="lote.css">
<!-- ?tema=oscuro: la misma tabla de noche (el tema de siempre es claro) -->
<script>if (/[?&]tema=oscuro/.test(location.search)) document.documentElement.dataset.tema = 'oscuro';</script>
</head>
<body>
  <main class="lo-escena" data-lote>
    <div class="lo-fondo" aria-hidden="true"><i class="lo-b1"></i><i class="lo-b2"></i><i class="lo-grano"></i></div>

    <section class="lo-panel" aria-labelledby="lo-titulo">
      <header class="lo-cab">
        <div class="lo-tit">
          <span class="lo-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3.8 8.3 12 4l8.2 4.3v7.4L12 20l-8.2-4.3z"/><path d="M3.8 8.3 12 12.6l8.2-4.3M12 12.6V20"/></svg>
          </span>
          <div>
            <h1 id="lo-titulo">Envíos de la semana</h1>
            <p class="lo-sub"><span class="lo-total" data-total></span> <span data-total-txt>envíos activos</span></p>
          </div>
        </div>
        <ul class="lo-resumen" aria-label="Resumen por estado" data-resumen></ul>
      </header>

      <div class="lo-tabla" role="grid" aria-multiselectable="true" aria-labelledby="lo-titulo">
        <div class="lo-cols" role="row">
          <div class="lo-c lo-c-chk" role="columnheader">
            <button class="lo-casilla" type="button" role="checkbox" aria-checked="false" aria-label="Seleccionar todos los envíos" data-todas>
              <span class="lo-caja"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="lo-vis" d="M3.6 8.4l3 3 5.8-6.4" pathLength="1"/><path class="lo-gui" d="M4.2 8h7.6" pathLength="1"/></svg></span>
            </button>
          </div>
          <div class="lo-c" role="columnheader">Envío</div>
          <div class="lo-c lo-c-dest" role="columnheader">Destino</div>
          <div class="lo-c lo-c-est" role="columnheader">Estado</div>
          <div class="lo-c lo-c-peso" role="columnheader">Peso</div>
          <div class="lo-c lo-c-fecha" role="columnheader">Entrega</div>
        </div>
        <div class="lo-cuerpo" data-cuerpo>
          <svg class="lo-pincel" data-pincel aria-hidden="true"><rect x="1" y="0" width="34" height="0" rx="17"/></svg>
          <div class="lo-lista" role="rowgroup" data-lista></div>
          <div class="lo-vacio" data-vacio hidden>
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 20.5 12.4 9.6A3 3 0 0 1 15 8h18a3 3 0 0 1 2.7 1.6L41 20.5"/><path d="M7 20.5h10.4a3 3 0 0 1 3 3 3.6 3.6 0 0 0 7.2 0 3 3 0 0 1 3-3H41V35a4 4 0 0 1-4 4H11a4 4 0 0 1-4-4z"/></svg>
            <p><b>Todo archivado</b>No queda ningún envío activo.</p>
            <button class="lo-btn lo-btn-claro" type="button" data-accion="restaurar">Restaurar los envíos</button>
          </div>
        </div>
      </div>

      <footer class="lo-pie" data-pie>
        <p class="lo-pista" data-pista>Arrastra por las casillas para pintar la selección <span aria-hidden="true">·</span> <kbd>Mayús</kbd> + clic marca un rango</p>

        <div class="lo-barra" data-barra data-modo="" role="region" aria-label="Acciones sobre la selección">
          <div class="lo-capa lo-capa-sel" data-capa-sel>
            <button class="lo-x" type="button" data-accion="limpiar" aria-label="Quitar la selección"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
            <p class="lo-cuenta"><span class="lo-num" data-num></span><span class="lo-uni" data-uni>seleccionadas</span></p>
            <i class="lo-sep" aria-hidden="true"></i>
            <p class="lo-peso"><span data-peso>0,0</span> kg</p>
            <button class="lo-btn lo-btn-linea" type="button" data-accion="exportar">
              <span class="lo-t lo-t1"><svg class="lo-ex-ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.6v7.6M4.9 7.4 8 10.5l3.1-3.1M3 13h10"/></svg><span class="lo-ex-tx">Exportar</span></span><span class="lo-t lo-t2" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3.6 8.4l3 3 5.8-6.4"/></svg><span class="lo-ex-tx">Exportado</span></span>
            </button>
            <button class="lo-btn lo-btn-azul" type="button" data-accion="archivar">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.8 5.2h10.4v7a1 1 0 0 1-1 1H3.8a1 1 0 0 1-1-1zM2 2.8h12v2.4H2zM6.4 8h3.2"/></svg>Archivar
            </button>
          </div>
          <div class="lo-capa lo-capa-hecho" data-capa-hecho>
            <span class="lo-ok" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3.8 8.4l2.9 2.9 5.5-6.2" pathLength="1"/></svg></span>
            <p class="lo-hecho-txt" data-hecho-txt>4 envíos archivados</p>
            <button class="lo-btn lo-btn-deshacer" type="button" data-accion="deshacer">Deshacer</button>
            <i class="lo-tiempo" aria-hidden="true"></i>
          </div>
        </div>
      </footer>
    </section>

    <p class="lo-oculto" role="status" aria-live="polite" data-vivo></p>
  </main>

  <script src="lote.js"></script>
  <script>Lote(document.querySelector('[data-lote]'));</script>
</body>
</html>
