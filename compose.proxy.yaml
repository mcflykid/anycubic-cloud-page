# Proxy en conteneur : Compose 2.24.4+ et réseau externe déjà partagé avec le proxy.
# docker compose -f compose.yaml -f compose.proxy.yaml up -d
services:
  # ============================================================================
  # Anycubic Cloud Page — accès au proxy par le réseau, sans port publié sur l’hôte.
  # ============================================================================
  anycubic-cloud-page:
    networks:
      proxy:
        aliases: ["anycubic-cloud-page"]
    ports: !reset []
networks:
  proxy:
    external: true
    name: "${PROXY_NETWORK:?Définissez le nom du réseau partagé dans PROXY_NETWORK}"
