name: Bug
description: Signaler un problème reproductible sans partager de secrets
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Comportement observé et attendu
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Modèle et versions de firmware
      description: Ne fournissez ni numéro de série, ni identifiant de compte.
  - type: textarea
    id: steps
    attributes:
      label: Étapes et erreurs expurgées
      description: Aucun token, email, mot de passe, certificat privé ou journal brut.
    validations:
      required: true
