name: Publish Docker image
on:
  workflow_run:
    workflows: ['Tests and publication safety']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: version
        run: echo "value=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mcflykid/anycubic-cloud-page:${{ steps.version.outputs.value }}
            ghcr.io/mcflykid/anycubic-cloud-page:latest
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
      - name: Download the published image anonymously and test the application
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker pull "ghcr.io/mcflykid/anycubic-cloud-page@$IMAGE_DIGEST"
          docker tag "ghcr.io/mcflykid/anycubic-cloud-page@$IMAGE_DIGEST" anycubic-cloud-page:test
          docker manifest inspect "ghcr.io/mcflykid/anycubic-cloud-page@$IMAGE_DIGEST" > /tmp/published-manifest.json
          python3 - <<'PY_MANIFEST'
          import json
          manifest = json.load(open('/tmp/published-manifest.json'))
          platforms = {(entry.get('platform', {}).get('os'), entry.get('platform', {}).get('architecture')) for entry in manifest.get('manifests', [])}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, 'Architectures attendues absentes'
          print('Image publique : linux/amd64 et linux/arm64 disponibles.')
          PY_MANIFEST
          python3 scripts/ci_compose.py host
