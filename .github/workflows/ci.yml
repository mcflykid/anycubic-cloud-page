name: Tests and publication safety
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    secrets:
      PUBLICATION_PRIVATE_PATTERNS:
        required: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r app/requirements.txt ruff==0.17.4
      - run: ruff format --check app scripts && ruff check app scripts
      - run: python -m unittest discover -s app -p 'test_*.py' -q
      - run: python -m unittest discover -s scripts -p 'test_*.py' -q
      - run: |
          for script in web/js/imprimante.js web/js/*.mjs; do node --check "$script" || exit; done
          python scripts/update_assets.py --check
      - name: Check publication without private configuration
        run: python scripts/check_publication.py
      - name: Check publication with private CI rules
        env:
          PUBLICATION_PRIVATE_PATTERNS: ${{ secrets.PUBLICATION_PRIVATE_PATTERNS }}
        run: python scripts/check_publication.py
      - run: docker compose config --quiet
  docker:
    name: Installation vide (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [host, proxy-network]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: docker build -t anycubic-cloud-page:test .
      - run: docker run --rm --network none --entrypoint python anycubic-cloud-page:test -m unittest discover -s app -p 'test_*.py' -q
      - name: Démarrage, PUID/PGID, droits, appdata et redémarrage sans mots de passe
        run: python scripts/ci_compose.py "${{ matrix.variant }}"

  ui:
    name: Interface de démonstration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # La version doit suivre le verrou npm pour retrouver le navigateur embarqué.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r app/requirements.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright test
